<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Voyage GPT V4</title><style>*{box-sizing:border-box}body{margin:0;background:#061d2a;color:#eef9f6;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:0;left:0;right:0;padding:24px 5vw;background:linear-gradient(#001623b8,transparent)}small{font-size:10px;letter-spacing:.2em;color:#afd7d3}h1{font-size:clamp(16px,2vw,23px);margin:7px 0;letter-spacing:.1em}#intro{position:absolute;left:5vw;top:28%;text-shadow:0 2px 20px #001521}#intro strong{display:block;font-size:clamp(42px,7vw,88px);line-height:1.1;letter-spacing:-.05em;font-weight:500;margin:12px 0}#intro p{font-size:13px;color:#cce2e3;line-height:1.7}#menu{position:absolute;right:4vw;top:28%;display:flex;flex-direction:column;gap:9px;pointer-events:auto}button{background:#0b3445ba;color:#fff;border:1px solid #a4d1ce85;padding:12px 16px;border-radius:24px;font-size:12px;backdrop-filter:blur(9px)}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:5vw;right:5vw;display:flex;justify-content:space-between;gap:12px;align-items:end}.ctrl{display:flex;gap:8px;pointer-events:auto}.on{background:#e2f1e9;color:#082c39}#touch{display:none;position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 92px);gap:8px;pointer-events:auto}#touch button{width:50px;height:50px;padding:0;font-size:22px}#tip{font-size:11px;color:#bbd6d6;line-height:1.7}#notice{position:absolute;top:19%;left:50%;transform:translateX(-50%);background:#092d40d9;padding:12px 18px;border-radius:9px;display:none;font-size:13px}@media(max-width:700px){#intro{top:23%;left:22px}#intro strong{font-size:49px}#menu{top:49%;right:18px}#menu button{padding:9px 12px;font-size:10px}#bottom{left:20px;right:20px;flex-direction:column;align-items:stretch}#touch{display:flex}.ctrl{justify-content:space-between}.ctrl button{padding:10px 12px}#tip{font-size:10px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script></head><body><div id="ui"><header><small>GREENPEACE · EXPLORABLE OCEAN</small><h1>OCEAN BEYOND BORDERS</h1></header><div id="intro"><small>01 / THE OPEN SEA</small><strong>국경 밖의<br>바다로.</strong><p>지도를 넘어, 우리가 지켜야 할 바다로.</p></div><div id="menu"><button data-i="0">01 등대</button><button data-i="1">02 기후의 바다</button><button data-i="2">03 플라스틱섬</button></div><div id="notice"></div><div id="touch"><button id="l">↶</button><button id="f">↑</button><button id="r">↷</button></div><div id="bottom"><div id="tip">W 전진 · A / D 회전 · 드래그 시점 회전<br>모바일: 화살표를 누른 상태로 항해</div><div class="ctrl"><button id="go" class="on">START VOYAGE</button><button id="mood">DEEP BLUE</button></div></div></div><script type="module">
import * as T from 'three';const scene=new T.Scene(),camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.1,7000),renderer=new T.WebGLRenderer({antialias:innerWidth>700});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.3:1.8));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xcbe6f1,0x123544,2));const sun=new T.DirectionalLight(0xffd4a1,2.3);sun.position.set(-100,150,-220);scene.add(sun);
const u={t:{value:0},eye:{value:camera.position},deep:{value:new T.Color('#032b3b')},mid:{value:new T.Color('#167988')},haze:{value:new T.Color('#739ca4')}};const ocean=new T.Mesh(new T.PlaneGeometry(11000,11000,innerWidth<700?120:210,innerWidth<700?120:210).rotateX(-Math.PI/2),new T.ShaderMaterial({uniforms:u,side:T.DoubleSide,vertexShader:'varying vec3 p,n;uniform float t;float w(vec2 a){return sin(a.x*.13+a.y*.07+t*.6)*.65+sin(a.y*.28-a.x*.17+t)*.3;}void main(){vec3 v=position;float h=w(v.xz);v.y+=h;float x=w(v.xz+vec2(.2,0.)),z=w(v.xz+vec2(0.,.2));n=normalize(vec3((h-x)/.2,1.,(h-z)/.2));vec4 world=modelMatrix*vec4(v,1.);p=world.xyz;gl_Position=projectionMatrix*viewMatrix*world;}',fragmentShader:'precision highp float;varying vec3 p,n;uniform float t;uniform vec3 eye,deep,mid,haze;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}void main(){float a=noise(p.xz*.16+vec2(t*.06,0.)),b=noise(p.xz*.55+vec2(0.,t*.08));vec3 N=normalize(n+vec3((a-.5)*.2,0.,(b-.5)*.2));vec3 V=normalize(eye-p);float f=pow(1.-max(dot(N,V),0.),3.);vec3 L=normalize(vec3(-.3,.18,-.94));float s=pow(max(dot(reflect(-L,N),V),0.),95.);float glow=pow(max(dot(reflect(-L,N),V),0.),14.);vec3 c=mix(deep,mid,.3+a*.4+b*.18);c=mix(c,haze,f*.35);c+=vec3(1.,.76,.46)*(s*1.8+glow*.2);c=mix(c,haze,clamp(1.-exp(-length(eye.xz-p.xz)*.0013),0.,.72));gl_FragColor=vec4(c,1.);}'}));scene.add(ocean);
const su={blue:{value:0}};const sky=new T.Mesh(new T.SphereGeometry(3600,36,18),new T.ShaderMaterial({uniforms:su,side:T.BackSide,depthWrite:false,vertexShader:'varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 d;uniform float blue;void main(){vec3 n=normalize(d);float h=pow(max(n.y,0.),.5);vec3 c=mix(mix(vec3(.45,.61,.65),vec3(.26,.42,.55),blue),vec3(.03,.12,.22),h);float s=max(dot(n,normalize(vec3(-.3,.18,-.94))),0.);c+=vec3(.95,.55,.28)*pow(s,15.)*.55*(1.-blue*.65)+vec3(1.,.8,.6)*pow(s,1100.)*1.7;gl_FragColor=vec4(c,1.);}'}));scene.add(sky);
const hull=new T.MeshStandardMaterial({color:0x263d42,roughness:.6}),white=new T.MeshStandardMaterial({color:0xdbe8e3}),glass=new T.MeshStandardMaterial({color:0x184153,metalness:.3,roughness:.2}),ship=new T.Group();scene.add(ship);function box(w,h,d,mat,x,y,z){let m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);ship.add(m)}box(5,1.6,13,hull,0,1,0);box(4.8,.25,12,white,0,2,0);box(3.7,2.5,5,white,0,3.5,-1.6);box(3.7,1,2.6,glass,0,4.2,-3);const mast=new T.Mesh(new T.CylinderGeometry(.07,.1,4),white);mast.position.set(0,6,-2);ship.add(mast);
const landmat=new T.MeshStandardMaterial({color:0x485b58,roughness:1}),green=new T.MeshStandardMaterial({color:0x436c5b}),cream=new T.MeshStandardMaterial({color:0xe1d4b6}),red=new T.MeshStandardMaterial({color:0xc96f57});const places=[{name:'등대',x:-110,z:-250},{name:'기후의 바다',x:170,z:-370},{name:'플라스틱섬',x:-280,z:-530}];places.forEach((d,i)=>{const group=new T.Group();group.position.set(d.x,0,d.z);const rock=new T.Mesh(new T.CylinderGeometry(22+i*10,35+i*10,13,9),landmat);rock.position.y=2;group.add(rock);if(i===0){let tower=new T.Mesh(new T.CylinderGeometry(3.5,5,40,10),cream);tower.position.y=27;group.add(tower);let top=new T.Mesh(new T.CylinderGeometry(5,5,5,10),red);top.position.y=50;group.add(top);let beacon=new T.PointLight(0xffe8b0,40,100);beacon.position.y=53;group.add(beacon)}else{for(let j=0;j<8;j++){let peak=new T.Mesh(new T.ConeGeometry(5+Math.random()*8,12+Math.random()*20,6),i===1?green:cream);peak.position.set((Math.random()-.5)*45,14,(Math.random()-.5)*40);group.add(peak)}}scene.add(group)});
let x=0,z=20,yaw=0,view=0,turn=0,forward=false,auto=false,goal=null,t=0,drag=false,last=0;const clock=new T.Clock();function notify(s){let n=document.querySelector('#notice');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',4000)}document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{goal=places[+b.dataset.i];auto=true;document.querySelector('#go').textContent='STOP VOYAGE';document.querySelector('#intro').style.opacity='0';notify(goal.name+'으로 항해합니다')});document.querySelector('#go').onclick=e=>{auto=!auto;goal=null;e.target.textContent=auto?'STOP VOYAGE':'START VOYAGE';document.querySelector('#intro').style.opacity=auto?'0':'1'};document.querySelector('#mood').onclick=e=>{let v=su.blue.value?0:1;su.blue.value=v;u.deep.value.set(v?'#021b34':'#032b3b');u.mid.value.set(v?'#0b5875':'#167988');u.haze.value.set(v?'#54758f':'#739ca4');e.target.textContent=v?'GOLDEN HOUR':'DEEP BLUE'};function hold(id,on,off){let e=document.querySelector(id);e.addEventListener('pointerdown',v=>{on();e.setPointerCapture(v.pointerId)});for(let ev of ['pointerup','pointercancel'])e.addEventListener(ev,off)}hold('#f',()=>forward=true,()=>forward=false);hold('#l',()=>turn=1,()=>turn=0);hold('#r',()=>turn=-1,()=>turn=0);addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')forward=true;if(e.key==='a'||e.key==='ArrowLeft')turn=1;if(e.key==='d'||e.key==='ArrowRight')turn=-1});addEventListener('keyup',()=>{forward=false;turn=0});renderer.domElement.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){view-=(e.clientX-last)*.004;last=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>drag=false);
function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.05);t+=dt;u.t.value=t;if(goal){let dx=goal.x-x,dz=goal.z-z,desired=Math.atan2(-dx,-dz),diff=Math.atan2(Math.sin(desired-yaw),Math.cos(desired-y));yaw+=T.MathUtils.clamp(diff,-dt*.42,dt*.42);if(Math.hypot(dx,dz)<48){notify(goal.name+' 도착');goal=null;auto=false;document.querySelector('#go').textContent='START VOYAGE'}}else yaw+=turn*dt*.55;if(forward||auto){x-=Math.sin(yaw)*dt*14;z-=Math.cos(yaw)*dt*14}ship.position.set(x,Math.sin(t*.65)*.18,z);ship.rotation.set(Math.sin(t*.4)*.012,yaw,Math.sin(t*.6)*.018);let a=yaw+view,desiredCam=new T.Vector3(x+Math.sin(a)*35,13,z+Math.cos(a)*35);camera.position.lerp(desiredCam,Math.min(1,dt*2.5));camera.lookAt(x,3,z-3);sky.position.copy(camera.position);ocean.position.set(x,0,z);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>

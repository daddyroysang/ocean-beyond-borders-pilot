<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OCEAN WORLD V2</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09212c;color:#eef9f5;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:0;left:0;right:0;padding:30px 5vw;background:linear-gradient(#061c2ba8,transparent);display:flex;justify-content:space-between;align-items:start}.mini{font-size:10px;letter-spacing:.25em;color:#b5d5d3}.brand{font-size:15px;letter-spacing:.11em;font-weight:700;margin-top:9px}.corner{font-size:11px;color:#b8d4d4}#copy{position:absolute;left:5vw;top:35%;text-shadow:0 2px 24px #001624aa}h1{font-size:clamp(43px,7vw,100px);font-weight:500;line-height:1.02;letter-spacing:-.065em;margin:12px 0 18px}p{font-size:15px;color:#d4e3e4;line-height:1.8;margin:0}#bar{position:absolute;bottom:26px;left:5vw;right:5vw;display:flex;align-items:end;justify-content:space-between;gap:15px}.help{font-size:11px;color:#abc9ca;line-height:1.6}.buttons{display:flex;gap:8px;pointer-events:auto}button{border:1px solid #d1e8e680;background:#103440aa;backdrop-filter:blur(12px);color:#f3fffc;border-radius:28px;font-size:12px;padding:12px 16px;cursor:pointer}button.on{background:#e4f0e9;color:#092631}#steer{position:absolute;bottom:106px;right:20px;display:none;gap:10px;pointer-events:auto}#steer button{width:48px;height:48px;padding:0;font-size:21px}#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#09212c;letter-spacing:.28em;color:#bbd6d5;font-size:11px}#err{display:none;position:fixed;inset:0;z-index:11;padding:28px;background:#09212c}@media(max-width:700px){header{padding:calc(env(safe-area-inset-top) + 22px) 22px}.corner{display:none}#copy{top:28%;left:22px;right:22px}h1{font-size:clamp(46px,12vw,65px)}p{font-size:13px}#bar{left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 18px);flex-direction:column;align-items:stretch;gap:12px}.help{font-size:10px}.buttons{justify-content:space-between}.buttons button{padding:11px 13px}#steer{display:flex;bottom:calc(env(safe-area-inset-bottom) + 111px)}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script></head><body>
<div id="loading">ENTERING THE OCEAN</div><div id="err">WebGL 환경을 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.</div><div id="ui"><header><div><div class="mini">GREENPEACE · VISUAL STUDY</div><div class="brand">OCEAN BEYOND BORDERS</div></div><div class="corner">OCEAN WORLD / CINEMATIC V2</div></header><div id="copy"><div class="mini">01 / THE OPEN SEA</div><h1>국경 밖의<br>바다로.</h1><p>우리가 지켜야 할 바다는<br>지도 위의 경계 너머까지 이어집니다.</p></div><div id="steer"><button id="left">←</button><button id="right">→</button></div><div id="bar"><div class="help">DRAG TO LOOK AROUND · SWIPE ON MOBILE<br>영상이 아닌 실시간 3D 바다입니다.</div><div class="buttons"><button id="view" class="on">CINEMATIC</button><button id="mood">DEEP BLUE</button><button id="pause">PAUSE</button></div></div></div>
<script id="waterVertex" type="x-shader/x-vertex">
varying vec3 vWorld;varying vec3 vNormal;varying float vHeight;uniform float uTime;
float wh(vec2 p){return sin(p.x*.2+p.y*.08+uTime*.7)*.65+sin(p.y*.42-p.x*.2+uTime*1.16)*.28+sin(p.x*1.1+p.y*.64-uTime*1.7)*.09;}
void main(){vec3 p=position;p.y+=wh(p.xz);float dx=wh(p.xz+vec2(.15,0.));float dz=wh(p.xz+vec2(0.,.15));vNormal=normalize(vec3((p.y-position.y-dx)/.15,1.,(p.y-position.y-dz)/.15));vHeight=p.y;vec4 w=modelMatrix*vec4(p,1.);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}
</script>
<script id="waterFragment" type="x-shader/x-fragment">
precision highp float;varying vec3 vWorld,vNormal;varying float vHeight;uniform float uTime;uniform vec3 uEye,uDeep,uMid,uHaze;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
void main(){vec2 p=vWorld.xz;float a=noise(p*.14+vec2(uTime*.07,-uTime*.1));float b=noise(p*.65+vec2(-uTime*.19,uTime*.16));vec3 n=normalize(vNormal+vec3((a-.5)*.34,0.,(b-.5)*.32));vec3 view=normalize(uEye-vWorld);float fres=pow(1.-max(dot(view,n),0.),3.);vec3 light=normalize(vec3(-.28,.18,-.94));float sun=pow(max(dot(reflect(-light,n),view),0.),115.);float broad=pow(max(dot(reflect(-light,n),view),0.),13.);float sparkle=pow(max(dot(reflect(-light,normalize(n+vec3((b-.5)*.2,0.,(a-.5)*.2))),view),0.),400.)*step(.52,b);vec3 base=mix(uDeep,uMid,clamp(.24+a*.45+b*.15+vHeight*.1,0.,1.));base*=.72+.28*max(dot(n,vec3(-.3,.9,-.3)),0.);vec3 c=mix(base,uHaze,fres*.27)+vec3(1.,.75,.47)*(sun*1.7+broad*.20+sparkle*.9);float foam=smoothstep(.67,.9,a*.32+b*.4+abs(vHeight)*.15);c=mix(c,vec3(.66,.85,.85),foam*.15);float d=length(uEye.xz-vWorld.xz);c=mix(c,uHaze,clamp(1.-exp(-d*.00095),0.,.75));gl_FragColor=vec4(c,1.);}
</script>
<script id="skyVertex" type="x-shader/x-vertex">varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}</script>
<script id="skyFragment" type="x-shader/x-fragment">
precision highp float;varying vec3 vDir;uniform float uTime,uBlue;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.01+vec2(4.1,1.7);a*=.5;}return v;}
void main(){vec3 d=normalize(vDir);float y=max(d.y,0.);vec3 h=mix(vec3(.43,.59,.63),vec3(.26,.42,.55),uBlue);vec3 up=mix(vec3(.035,.13,.22),vec3(.018,.062,.14),uBlue);vec3 c=mix(h,up,pow(y,.45));vec3 sun=normalize(vec3(-.28,.18,-.94));float dotSun=max(dot(d,sun),0.);float glow=pow(dotSun,15.);c+=vec3(.97,.56,.29)*glow*.6*(1.-uBlue*.65);c+=vec3(1.,.79,.57)*pow(dotSun,1400.)*2.1*(1.-uBlue*.7);vec2 q=vec2(atan(d.z,d.x)*2.5,asin(d.y)*5.);float n=fbm(q+vec2(uTime*.0005,0.));float n2=fbm(q*1.8);float clouds=smoothstep(.48,.67,n*.75+n2*.25)*smoothstep(-.03,.18,d.y)*(1.-smoothstep(.65,1.,y));c=mix(c,vec3(.56,.63,.65),clouds*.39);gl_FragColor=vec4(c,1.);}
</script>
<script type="module">
import * as THREE from 'three';
try{
const mobile=innerWidth<700,renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.4:1.8));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(mobile?65:58,innerWidth/innerHeight,.1,10000);camera.position.set(0,8,26);
const u={uTime:{value:0},uEye:{value:camera.position},uDeep:{value:new THREE.Color('#032c3b')},uMid:{value:new THREE.Color('#147b8a')},uHaze:{value:new THREE.Color('#739ba3')}};
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(14000,14000,mobile?150:240,mobile?150:240).rotateX(-Math.PI/2),new THREE.ShaderMaterial({uniforms:u,vertexShader:document.querySelector('#waterVertex').textContent,fragmentShader:document.querySelector('#waterFragment').textContent,side:THREE.DoubleSide}));scene.add(ocean);
const su={uTime:{value:0},uBlue:{value:0}};const sky=new THREE.Mesh(new THREE.SphereGeometry(6500,48,24),new THREE.ShaderMaterial({uniforms:su,vertexShader:document.querySelector('#skyVertex').textContent,fragmentShader:document.querySelector('#skyFragment').textContent,side:THREE.BackSide,depthWrite:false}));scene.add(sky);
let t=0,paused=false,heading=0,goal=0,pitch=-.05,steer=0,drag=false,x=0,y=0;const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);let dt=Math.min(.05,clock.getDelta());if(!paused)t+=dt;u.uTime.value=t;su.uTime.value=t;goal+=steer*dt*.85;heading+=(goal-heading)*Math.min(1,dt*3);camera.position.set(Math.sin(t*.06)*.5,8+Math.sin(t*.4)*.12,26);camera.lookAt(camera.position.clone().add(new THREE.Vector3(Math.sin(heading),pitch,-Math.cos(heading)).multiplyScalar(100)));sky.position.copy(camera.position);renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?65:58;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.4:1.8))}addEventListener('resize',resize);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;x=e.clientX;y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;goal-=(e.clientX-x)*.003;pitch=Math.max(-.25,Math.min(.3,pitch+(e.clientY-y)*.0016));x=e.clientX;y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'PLAY':'PAUSE'};document.querySelector('#view').onclick=e=>{let c=document.querySelector('#copy');let hidden=c.style.opacity==='0';c.style.opacity=hidden?'1':'0';e.target.textContent=hidden?'CINEMATIC':'CLEAN VIEW'};document.querySelector('#mood').onclick=e=>{let v=su.uBlue.value===0?1:0;su.uBlue.value=v;u.uDeep.value.set(v?'#021b34':'#032c3b');u.uMid.value.set(v?'#0b5875':'#147b8a');u.uHaze.value.set(v?'#54758f':'#739ba3');e.target.textContent=v?'GOLDEN HOUR':'DEEP BLUE'};
for(let [id,v] of [['left',-1],['right',1]]){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{steer=v;e.preventDefault()});for(let key of ['pointerup','pointercancel','pointerleave'])el.addEventListener(key,()=>steer=0)}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer=-1;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer=1});addEventListener('keyup',()=>steer=0);
frame();document.querySelector('#loading').remove();
}catch(e){console.error(e);document.querySelector('#loading').remove();let x=document.querySelector('#err');x.style.display='block';x.textContent='렌더링 오류: '+e.message}
</script></body></html>

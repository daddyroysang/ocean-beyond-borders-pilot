<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>항해 데모 (비공식 컨셉 시안)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #1d5f6b; color: #14201a;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 14px 22px; background: linear-gradient(rgba(6,30,40,.6), rgba(6,30,40,0)); color: #fff; }
  #logo { font-weight: 800; letter-spacing: .1em; font-size: 13px; color: #a6ec62; white-space: nowrap; }
  nav { margin-left: auto; position: relative; display: flex; padding: 4px; border-radius: 999px;
    background: rgba(8,34,44,.38); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
  nav button { position: relative; z-index: 1; padding: 7px 11px; font-size: 13.5px; border-radius: 999px; white-space: nowrap; color: rgba(255,255,255,.88); transition: color .35s ease; }
  nav button.on { color: #0d2408; }
  #navpill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: 0; border-radius: 999px; background: #fff; opacity: 0;
    transition: transform .55s cubic-bezier(.22,1,.36,1), width .55s cubic-bezier(.22,1,.36,1), opacity .3s ease, background .35s ease; }
  nav button.give { color: #a6ec62; font-weight: 700; }
  nav button.give.on { color: #0d2408; }
  nav[data-on="donate"] #navpill { background: #8fe03a; }

  @media (max-width: 374px) { header { gap: 6px; padding-left: 10px; padding-right: 10px; } #logo { font-size: 11.5px; letter-spacing: .06em; } nav button { padding: 7px 8px; font-size: 12.5px; } }
  #badge { position: fixed; z-index: 6; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); font-size: 10px; letter-spacing: .08em;
    color: rgba(255,255,255,.62); text-shadow: 0 1px 6px rgba(0,30,40,.6); pointer-events: none; }
  #shipstat { display: none; }

  /* 첫 화면: 페이지 안에 심은 정지 장면이 가장 먼저 깔리고, 영상은 재생이 시작된 뒤에 그 위로 겹쳐 나타난다 */
  #heroStill, #heroVideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; z-index: 1; pointer-events: none; }
  #heroStill { transition: opacity 2s ease; background: #1d5f6b; }
  #heroVideo { opacity: 0; transition: opacity .8s ease; background: transparent; }
  body.vplay #heroVideo { opacity: 1; }
  body[data-mode="world"] #heroStill { opacity: 0; }
  body[data-mode="world"] #heroVideo { opacity: 0; transition: opacity 2s ease; }
  /* 장면이 준비되기 전에는 글자를 하나도 띄우지 않는다 */
  header, #badge, #snd { opacity: 0; transition: opacity .9s ease; }
  body.ready header, body.ready #badge, body.ready #snd { opacity: 1; }
  #snd { position: fixed; z-index: 6; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; gap: 2.5px; background: rgba(8,34,44,.38); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #snd i { width: 2px; height: 12px; border-radius: 2px; background: #fff; transform-origin: center; animation: eq 1.1s ease-in-out infinite; }
  #snd i:nth-child(2) { animation-delay: -.35s; } #snd i:nth-child(3) { animation-delay: -.7s; } #snd i:nth-child(4) { animation-delay: -.2s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  body[data-sound="off"] #snd i, body:not([data-sounding]) #snd i { animation: none; transform: scaleY(.25); opacity: .6; }
  #grade { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: none; }
  #arrive { position: fixed; inset: 0; z-index: 4; background: #0b2a33; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
  #arrive video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 7s ease-out; }
  #arrive::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,28,36,.5), rgba(6,28,36,0) 50%); opacity: 0; transition: opacity 1.2s ease; }
  body[data-card] #arrive::after { opacity: 1; }
  body[data-arrive] #arrive { opacity: 1; pointer-events: auto; }
  body[data-arrive] #arrive video { transform: scale(1); }
  body[data-arrive] #hint, body[data-arrive] .label { opacity: 0 !important; }
  #vig { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(8,24,34,.26) 100%); }
  #hero { position: fixed; z-index: 4; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column;
    justify-content: flex-end; padding: 0 24px calc(64px + env(safe-area-inset-bottom)); pointer-events: none;
    transition: opacity .7s ease, transform .9s cubic-bezier(.22,1,.36,1); color: #fff; }
  #hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(6,28,36,.92), rgba(6,28,36,.55) 30%, rgba(6,28,36,0) 62%); opacity: 0; transition: opacity 1.2s ease; }
  body.ready #hero::before { opacity: 1; }
  #hero p.kicker { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .18em; color: #a6ec62; margin-bottom: 14px; }
  #hero p.kicker::before { content: ""; width: 28px; height: 1px; background: #a6ec62; transform: scaleX(0); transform-origin: left; transition: transform .9s .1s cubic-bezier(.22,1,.36,1); }
  body.ready #hero p.kicker::before { transform: scaleX(1); }
  #hero h1 { font-family: "Noto Serif KR", "Apple SD Gothic Neo", serif; font-weight: 700; font-size: clamp(30px, 8.2vw, 56px); line-height: 1.26; letter-spacing: -.02em; max-width: 12em; word-break: keep-all; }
  #hero p.sub { margin-top: 14px; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.8); }
  .hw { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; }
  .hw > span { display: inline-block; transform: translateY(112%); transition: transform .8s cubic-bezier(.22,1,.36,1); }
  body.ready .hw > span { transform: none; }
  .hr { opacity: 0; transform: translateY(12px); transition: opacity .8s ease, transform .9s cubic-bezier(.22,1,.36,1); }
  body.ready .hr { opacity: 1; transform: none; }
  #start { pointer-events: auto; position: relative; margin-top: 26px; align-self: flex-start; display: flex; align-items: center; gap: 10px;
    padding: 15px 20px 15px 24px; border-radius: 999px; background: #fff; color: #0d2408; font-weight: 700; font-size: 16px; }
  #start::after { content: "→"; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #8fe03a; font-size: 14px; }
  #start::before { content: ""; position: absolute; inset: -1px; border-radius: 999px; border: 1px solid rgba(255,255,255,.7); animation: ring 2.6s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(1.18, 1.5); opacity: 0; } }
  body[data-mode="world"] #hero { opacity: 0; transform: translateY(26px); }
  body[data-mode="world"] #start { pointer-events: none; }

  #hint { position: fixed; z-index: 4; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); display: flex; gap: 12px; align-items: center;
    padding: 9px 16px; border-radius: 999px; font-size: 12px; letter-spacing: .04em; color: rgba(255,255,255,.92); white-space: nowrap;
    background: rgba(8,34,44,.38); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    opacity: 0; transition: opacity .7s ease, transform .9s cubic-bezier(.22,1,.36,1); pointer-events: none; }
  #hint b { font-weight: 700; color: #a6ec62; margin-right: 5px; }
  #hint em { width: 1px; height: 10px; background: rgba(255,255,255,.3); }
  body[data-mode="world"]:not([data-card]):not([data-arrive]):not([data-hinted]) #hint { opacity: 1; transform: translate(-50%, 0); transition-delay: 1.2s; }

  #trip { position: fixed; z-index: 4; left: 50%; bottom: calc(60px + env(safe-area-inset-bottom)); width: min(330px, 84vw); margin-left: calc(min(330px, 84vw) / -2);
    text-align: center; color: #fff; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .45s cubic-bezier(.22,1,.36,1); }
  #trip::before { content: ""; position: absolute; inset: -34px -46px -30px; z-index: -1; background: radial-gradient(closest-side, rgba(4,30,40,.5), rgba(4,30,40,0)); }
  body[data-trip]:not([data-arrive]) #trip { opacity: 1; transform: none; }
  #trip-to { font-size: 10.5px; font-weight: 700; letter-spacing: .2em; color: #a6ec62; }
  #trip-bar { position: relative; width: 132px; height: 1px; margin: 10px auto 13px; background: rgba(255,255,255,.28); }
  #trip-fill { position: absolute; left: 0; top: -0.5px; height: 2px; width: 0; background: #a6ec62; border-radius: 2px; }
  #trip-text { font-size: 15.5px; line-height: 1.6; font-weight: 500; letter-spacing: -.01em; word-break: keep-all; text-shadow: 0 1px 12px rgba(0,30,40,.8); }
  #trip .w > span { transition-duration: .4s; }
  body[data-trip] #trip .w > span { transform: none; }

  .label { position: fixed; z-index: 3; left: 0; top: 0; padding: 0 0 34px; color: #fff; font-size: 12.5px; font-weight: 600;
    letter-spacing: .06em; transition: opacity .4s ease; white-space: nowrap; }
  .label span { display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 12px 6px 10px; border-radius: 999px; background: rgba(8,34,44,.4); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .3s ease, transform .3s ease; }
  .label span i { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #a6ec62; }
  .label:active span { transform: scale(.96); background: rgba(8,34,44,.6); }
  .label::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 1px; height: 22px; background: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,0)); }
  .label::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #a6ec62; box-shadow: 0 0 0 4px rgba(166,236,98,.25); animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(166,236,98,.5); } 80%, 100% { box-shadow: 0 0 0 10px rgba(166,236,98,0); } }

  /* 도착 카드: 영상이 비치는 유리판 + 글자가 차례로 올라온다 (VengeanceUI의 stagger text / animated number / border beam 모션을 옮김) */
  #card { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; color: #fff;
    padding: 26px 24px calc(20px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; overflow: hidden;
    background: linear-gradient(rgba(10,38,48,.36), rgba(6,26,34,.66)); border-top: 1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(20px) saturate(1.35); backdrop-filter: blur(20px) saturate(1.35);
    box-shadow: 0 -18px 50px rgba(0,20,28,.28);
    opacity: 0; transform: translateY(34px); pointer-events: none;
    transition: opacity .35s ease, transform .45s ease; }
  body[data-card] #card { opacity: 1; transform: none; pointer-events: auto;
    transition: opacity .9s ease, transform 1.1s cubic-bezier(.22,1,.36,1); }
  #card::before { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 1.5px; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0), #b9ff7a, rgba(255,255,255,.95), rgba(255,255,255,0)); }
  body[data-card] #card::before { animation: beam 1.9s .35s cubic-bezier(.22,1,.36,1) both; }
  @keyframes beam { 0% { left: -40%; opacity: 0; } 15% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
  .rv { opacity: 0; transform: translateY(12px); transition: opacity .7s ease, transform .8s cubic-bezier(.22,1,.36,1); }
  body[data-card] .rv { opacity: 1; transform: none; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; }
  .w > span { display: inline-block; transform: translateY(112%); transition: transform .65s cubic-bezier(.22,1,.36,1); will-change: transform; }
  body[data-card] .w > span { transform: none; }
  #c-tag { font-size: 11px; font-weight: 700; letter-spacing: .16em; color: #a6ec62; }
  #c-title { font-family: "Noto Serif KR", "Apple SD Gothic Neo", serif; font-weight: 700; font-size: 30px; line-height: 1.22; margin-top: 8px; letter-spacing: -.02em; }
  #c-body { margin-top: 12px; font-size: 15px; line-height: 1.68; color: rgba(255,255,255,.86); word-break: keep-all; }
  .stat { margin-top: 18px; padding-top: 16px; display: flex; align-items: baseline; gap: 12px; position: relative; }
  .stat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(255,255,255,.24);
    transform: scaleX(0); transform-origin: left; transition: transform 1s .55s cubic-bezier(.22,1,.36,1); }
  body[data-card] .stat::before { transform: scaleX(1); }
  #c-stat { font-size: 36px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #c-statlabel { font-size: 13px; color: rgba(255,255,255,.72); }
  #c-cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 18px; padding: 15px 18px;
    border-radius: 999px; background: #7ddc2e; color: #0d2408; font-weight: 700; font-size: 15px; }
  #c-cta::after { content: "→"; transition: transform .3s ease; }
  #c-cta:active::after { transform: translateX(4px); }
  #c-cta:disabled { background: rgba(255,255,255,.12); color: rgba(255,255,255,.55); cursor: default; }
  #c-cta:disabled::after { content: ""; }
  #fade { position: fixed; inset: 0; z-index: 50; background: #06141b; opacity: 0; pointer-events: none; transition: opacity .6s; }
  body[data-leaving] #fade { opacity: 1; }
  #c-close { display: block; width: 100%; margin-top: 6px; padding: 12px; font-size: 13px; color: rgba(255,255,255,.7); letter-spacing: .02em; }
  @media (min-width: 720px) { #card { left: auto; right: 24px; bottom: 24px; margin: 0; border-radius: 26px; width: 400px; border: 1px solid rgba(255,255,255,.22); } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<img id="heroStill" src="__POSTER__" alt="" decoding="sync">
<video id="heroVideo" src="hero.mp4" preload="auto" autoplay muted loop playsinline></video>
<audio id="amb" src="ambience.mp3" loop preload="none"></audio>
<div id="arrive"><video id="arriveVideo" muted playsinline preload="auto"></video></div>
<div id="grade"></div>
<div id="vig"></div>
<div id="fade"></div>

<header>
  <button id="logo" aria-label="처음으로">GREENPEACE</button>
  <nav>
    <div id="navpill"></div>
    <button data-go="ocean">해양</button>
    <button data-go="climate">기후</button>
    <button data-go="plastic">플라스틱</button>
    <button data-go="donate" class="give">후원하기</button>
  </nav>
</header>

<section id="hero">
  <p class="kicker hr">GREENPEACE · 서울사무소</p>
  <h1 id="heroTitle">그린피스의 현장으로 직접 항해해 보세요</h1>
  <p class="sub hr" style="transition-delay:.75s">메뉴를 누르면 배가 그곳으로 갑니다.</p>
  <button id="start" class="hr" style="transition-delay:.95s">항해 시작</button>
</section>

<div id="labels"></div>
<div id="trip" aria-live="polite"><div id="trip-to"></div><div id="trip-bar"><i id="trip-fill"></i></div><p id="trip-text"></p></div>
<div id="hint"><span><b>탭</b>그곳으로 항해</span><em></em><span><b>끌기</b>둘러보기</span></div>

<aside id="card" aria-live="polite">
  <div id="c-tag" class="rv"></div>
  <h2 id="c-title"></h2>
  <p id="c-body"></p>
  <div class="stat"><span id="c-stat"></span><span id="c-statlabel" class="rv"></span></div>
  <button id="c-cta" class="rv"></button>
  <button id="c-close" class="rv">닫고 계속 항해</button>
</aside>

<button id="snd" aria-label="소리 켜기/끄기"><i></i><i></i><i></i><i></i></button>
<div id="badge">비공식 컨셉 시안 · v2.4<span id="shipstat">임시 배</span></div>
<script>window.__SHIP_GLB = "__SHIP_B64__"; window.__ISLANDS = __ISLANDS_JSON__;</script>

<script>/*__BUNDLE__*/</script>
</body>
</html>
